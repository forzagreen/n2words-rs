[package]
name = "n2words"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Convert numbers to words in 50 languages (72 regional variants): cardinal, ordinal and currency forms, with arbitrary-precision input"
license = "MIT"
authors = ["Wael TELLAT"]
repository = "https://github.com/forzagreen/n2words-rs"
homepage = "https://github.com/forzagreen/n2words-rs"
documentation = "https://docs.rs/n2words"
readme = "README.md"
keywords = ["number-to-words", "i18n", "numbers", "localization", "spell-out"]
categories = ["internationalization", "localization", "text-processing", "value-formatting"]
exclude = ["/.github", "/tests", "/scripts", "/benches", "/docs", "/.gitignore", "/cliff.toml", "/release.toml"]

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "n2words"
path = "src/bin/n2words.rs"

[[test]]
name = "conversions"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
