name: Release

# Cut a release by pushing a `vX.Y.Z` tag whose version matches Cargo.toml
# (`cargo release` does this, see CONTRIBUTING.md). The workflow then:
#   1. verifies the tag and runs the test suite,
#   2. publishes the crate to crates.io through trusted publishing (OIDC),
#   3. creates the GitHub release with this version's changelog section,
#   4. attaches prebuilt `n2words` binaries for the main platforms.
#
# One-time setup on crates.io (Settings → Trusted Publishing of the crate):
# repository owner `forzagreen`, repository `n2words-rs`, workflow
# `release.yml`, environment `crates-io`. The crate's first version has to be
# published once by hand (`cargo publish`) before that page exists.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "n2words") | .version')
          echo "tag=$TAG cargo=$CARGO"
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets --locked && cargo test --doc --locked
      - name: Package
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changelog for this version
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}

  binaries:
    name: Binary (${{ matrix.target }})
    needs: [verify, github-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: n2words
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
