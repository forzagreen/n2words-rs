# cargo-release configuration (https://github.com/crate-ci/cargo-release).
#
#   cargo release patch --execute
#
# bumps Cargo.toml, regenerates CHANGELOG.md with git-cliff, updates the
# docs.rs link in src/lib.rs, commits, tags vX.Y.Z and pushes. The tag push
# triggers .github/workflows/release.yml, which publishes to crates.io and
# creates the GitHub release; nothing is published from the local machine.

allow-branch = ["main"]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"
pre-release-hook = ["git", "cliff", "--config", "cliff.toml", "--tag", "v{{version}}", "--output", "CHANGELOG.md"]
pre-release-replacements = [
  { file = "src/lib.rs", search = "docs\\.rs/n2words/[0-9]+\\.[0-9]+\\.[0-9]+", replace = "docs.rs/n2words/{{version}}", exactly = 1 },
]
